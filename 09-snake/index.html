<body><main><h1>Jogo da cobrinha</h1><p>Coma as frutas sem bater nas paredes ou no próprio corpo.</p><p>Use as setas do teclado, WASD ou os botões de direção.</p><canvas id="game" width="400" height="400" aria-label="Tabuleiro da cobrinha">Seu navegador precisa oferecer suporte ao Canvas.</canvas><p id="status" class="status" role="status"></p><div class="row"><button id="start">Iniciar / reiniciar</button><button id="pause" disabled>Pausar</button></div><p class="row"><button data-dir="up" aria-label="Cima">↑</button><button data-dir="left" aria-label="Esquerda">←</button><button data-dir="down" aria-label="Baixo">↓</button><button data-dir="right" aria-label="Direita">→</button></p><footer>Projeto didático • HTML5, CSS3 e JavaScript</footer></main></body>
