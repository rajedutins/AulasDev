<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Digite dois números e escolha uma operação.">
<title>Calculadora | Aulas de programação</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js" defer></script>
</head>
<body><main><h1>Calculadora</h1><p>Digite dois números e escolha uma operação.</p><form id="calc"><label>Primeiro número<input id="a" type="number" step="any" required></label><label>Operação<select id="op"><option value="+">Somar (+)</option><option value="-">Subtrair (−)</option><option value="*">Multiplicar (×)</option><option value="/">Dividir (÷)</option></select></label><label>Segundo número<input id="b" type="number" step="any" required></label><div class="row"><button>Calcular</button><button type="reset">Limpar</button></div></form><p id="result" class="display" aria-live="polite">0</p><footer>Projeto didático • HTML5, CSS3 e JavaScript</footer></main></body>
</html>
